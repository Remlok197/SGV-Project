services:
  db:
    image: postgres:15
    container_name: sgvye_db_postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: Qwertyz..
      POSTGRES_DB: sgvye_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: